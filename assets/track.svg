nt-size="10.5" fill="#7f93a8">›</text><text x="60" y="451" font-size="10.5" fill="#e2e8f0" fill-opacity=".88">Mentored PyTorch implementation and edge-case</text><text x="60" y="466" font-size="10.5" fill="#e2e8f0" fill-opacity=".88">debugging</text><rect x="460.5" y="0.5" width="439" height="180.33333333333334" rx="10" fill="url(#bg)" stroke="#12324a"/><rect x="461" y="1" width="438" height="179.33333333333334" rx="10" fill="url(#grid)" opacity=".6"/><rect x="474" y="0" width="412" height="3" rx="1.5" fill="#22d3ee" filter="url(#glow2)"/><text x="480" y="28" font-size="11" fill="#7f93a8" letter-spacing="1.5">▸ RESEARCH</text><rect x="480" y="42" width="44.4" height="20" rx="5" fill="#22d3ee" fill-opacity=".12" stroke="#22d3ee" stroke-opacity=".5"/><text x="502.2" y="56" text-anchor="middle" font-size="9.5" font-weight="700" fill="#22d3ee">IEEE</text><text x="536.4" y="56" font-size="11" fill="#e2e8f0">Neuro-Feedback VR · IEEE CE2CT 2025</text><text x="536.4" y="71" font-size="9.5" fill="#7f93a8">real-time emotion manipulation, adaptive VR environments</text><rect x="480" y="82" width="64.2" height="20" rx="5" fill="#a78bfa" fill-opacity=".12" stroke="#a78bfa" stroke-opacity=".5"/><text x="512.1" y="96" text-anchor="middle" font-size="9.5" font-weight="700" fill="#a78bfa">JOURNAL</text><text x="556.2" y="96" font-size="11" fill="#e2e8f0">Dynamic VR Environment Synthesis · IJECS 2025</text><text x="556.2" y="111" font-size="9.5" fill="#7f93a8">ML for real-time 3D object integration · DOAJ, SINTA</text><rect x="480" y="122" width="37.8" height="20" rx="5" fill="#f472b6" fill-opacity=".12" stroke="#f472b6" stroke-opacity=".5"/><text x="498.9" y="136" text-anchor="middle" font-size="9.5" font-weight="700" fill="#f472b6">TPC</text><text x="529.8" y="136" font-size="11" fill="#e2e8f0">Program Committee &amp; Reviewer · IEEE AUTOCOM 2026</text><text x="529.8" y="151" font-size="9.5" fill="#7f93a8">peer review of submitted research papers</text><rect x="460.5" y="193.833333