th="57.4" height="22" rx="5" fill="#00f5d4" fill-opacity=".08" stroke="#00f5d4" stroke-opacity=".4"/><text x="31.0" y="282.6" font-size="10" fill="#e2e8f0">PyTorch</text><rect x="88.4" y="268" width="32.6" height="22" rx="5" fill="#00f5d4" fill-opacity=".08" stroke="#00f5d4" stroke-opacity=".4"/><text x="95.4" y="282.6" font-size="10" fill="#e2e8f0">ViT</text><rect x="128.0" y="268" width="51.2" height="22" rx="5" fill="#00f5d4" fill-opacity=".08" stroke="#00f5d4" stroke-opacity=".4"/><text x="135.0" y="282.6" font-size="10" fill="#e2e8f0">OpenCV</text><rect x="186.2" y="268" width="94.6" height="22" rx="5" fill="#00f5d4" fill-opacity=".08" stroke="#00f5d4" stroke-opacity=".4"/><text x="193.2" y="282.6" font-size="10" fill="#e2e8f0">TensorRT INT8</text><rect x="287.8" y="268" width="76.0" height="22" rx="5" fill="#00f5d4" fill-opacity=".08" stroke="#00f5d4" stroke-opacity=".4"/><text x="294.8" y="282.6" font-size="10" fill="#e2e8f0">MC Dropout</text><rect x="370.8" y="268" width="82.2" height="22" rx="5" fill="#00f5d4" fill-opacity=".08" stroke="#00f5d4" stroke-opacity=".4"/><text x="377.8" y="282.6" font-size="10" fill="#e2e8f0">Jetson Nano</text><rect x="460.0" y="268" width="51.2" height="22" rx="5" fill="#00f5d4" fill-opacity=".08" stroke="#00f5d4" stroke-opacity=".4"/><text x="467.0" y="282.6" font-size="10" fill="#e2e8f0">Gradio</text><rect x="548" y="20" width="328" height="276" rx="10" fill="none" stroke="#00f5d4" stroke-opacity=".35" stroke-dasharray="4 4"/><text x="560" y="38" font-size="8.5" fill="#00f5d4" letter-spacing=".6">JETSON NANO · TENSORRT INT8 · &lt;200 MS</text><rect x="560.0" y="50.0" width="82.0" height="28" rx="6" fill="#00f5d4" fill-opacity=".1" stroke="#00f5d4" stroke-opacity=".6"/><text x="601.0" y="67.4" text-anchor="middle" font-size="9.5" fill="#e2e8f0">Fundus image</text><rect x="668.0" y="50.0" width="196.0" height="28" rx="6" fill="#00f5d4" fill-opacity=".1" stroke="#00f5d4" stroke-opacity=".6"/><text x="766.0" y="67.4" text-anchor="middle" font-size="9.5" fill="#e2e8f0" font-weight="700">Dual-scale encoder</text><line x1="642" y1="64" x2="663" y2="64" stroke="#00f5d4" stroke-opacity=".7"/><polygon points="668.0,64.0 662.0,60.5 662.0,67.5" fill="#00f5d4" fill-opacity=".85"/><rect x="560.0" y="118.0" width="150.0" height="28" rx="6" fill="#00f5d4" fill-opacity=".1" stroke="#00f5d4" stroke-opacity=".6"/><text x="635.0" y="135.4" text-anchor="middle" font-size="9.5" fill="#e2e8f0">Lesion localization</text><rect x="718.0" y="118.0" width="146.0" height="28" rx="6" fill="#00f5d4" fill-opacity=".1" stroke="#00f5d4" stroke-opacity=".6"/><text x="791.0" y="135.4" text-anchor="middle" font-size="9.5" fill="#e2e8f0">Ordinal DR grading</text><line x1="766" y1="78" x2="635" y2="113" stroke="#00f5d4" stroke-opacity=".7"/><polygon points="635.0,118.0 631.5,112.0 638.5,112.0" fill="#00f5d4" fill-opacity=".85"/><line x1="766" y1="78" x2="791" y2="113" stroke="#00f5d4" stroke-opacity=".7"/><polygon points="791.0,118.0 787.5,112.0 794.5,112.0" fill="#00f5d4" fill-opacity=".85"/><rect x="610.0" y="184.0" width="214.0" height="30" rx="6" fill="#a78bfa" fill-opacity=".1" stroke="#a78bfa" stroke-opacity=".6"/><text x="717.0" y="202.4" text-anchor="middle" font-size="9.5" fill="#e2e8f0" font-weight="700">Monte Carlo Dropout · uncertainty</text><line x1="635" y1="146" x2="717" y2="180" stroke="#a78bfa" stroke-opacity=".7"/><line x1="791" y1="146" x2="717" y2="180" stroke="#a78bfa" stroke-opacity=".7"/><polygon points="717.0,184.0 713.5,178.0 720.5,178.0" fill="#a78bfa" fill-opacity=".85"/><rect x="560.0" y="250.0" width="150.0" height="28" rx="6" fill="#4ade80" fill-opacity=".1" stroke="#4ade80" stroke-opacity=".6"/><text x="635.0" y="267.4" text-anchor="middle" font-size="9.5" fill="#e2e8f0">Automated result</text><rect x="718.0" y="250.0" width="146.0" height="28" rx="6" fill="#fbbf24" fill-opacity=".1" stroke="#fbbf24" stroke-opacity=".6"/><text x="791.0" y="267.4" text-anchor="middle" font-size="9.5" fill="#e2e8